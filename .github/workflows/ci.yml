name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres_server1:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barcodes_server1
          POSTGRES_USER: barcodes
          POSTGRES_PASSWORD: barcodes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U barcodes -d barcodes_server1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres_server2:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barcodes_server2
          POSTGRES_USER: barcodes
          POSTGRES_PASSWORD: barcodes
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U barcodes -d barcodes_server2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SERVER1_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5433/barcodes_server1
      SERVER2_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5434/barcodes_server2
      TEST_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5433/barcodes_server1
      TEST_SERVER2_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5434/barcodes_server2
      TEST_HARDENING_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5434/w8_test_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Upgrade Server 1 database
        env:
          DATABASE_URL: ${{ env.SERVER1_DATABASE_URL }}
        run: alembic -c alembic-server1.ini upgrade head

      - name: Upgrade Server 2 database
        env:
          DATABASE_URL: ${{ env.SERVER2_DATABASE_URL }}
        run: alembic -c alembic-server2.ini upgrade head

      - name: Upgrade isolated hardening database
        env:
          PGPASSWORD: barcodes
          DATABASE_URL: ${{ env.TEST_HARDENING_DATABASE_URL }}
        run: |
          createdb -h localhost -p 5434 -U barcodes w8_test_ci
          alembic -c alembic-server2.ini upgrade head

      - name: Check migration drift
        run: |
          DATABASE_URL=${{ env.SERVER1_DATABASE_URL }} alembic -c alembic-server1.ini check
          DATABASE_URL=${{ env.SERVER2_DATABASE_URL }} alembic -c alembic-server2.ini check

      - name: Test
        run: pytest

      - name: Build runtime image
        run: docker build --target runtime -t daas-barcodes:${{ github.sha }} .

      - name: Encrypted backup and restore rehearsal
        run: |
          docker build -f deploy/backup/Dockerfile -t barcodes-backup-ci .
          docker run --rm --network host -e PGHOST=localhost -e PGPORT=5433 -e PGUSER=barcodes -e PGPASSWORD=barcodes -e PGDATABASE=barcodes_server1 barcodes-backup-ci sh /opt/barcodes/verify_restore.sh
          docker run --rm --network host -e PGHOST=localhost -e PGPORT=5434 -e PGUSER=barcodes -e PGPASSWORD=barcodes -e PGDATABASE=barcodes_server2 barcodes-backup-ci sh /opt/barcodes/verify_restore.sh

      - name: Non-root runtime smoke test
        run: |
          docker run --rm --network host -e DATABASE_URL=${{ env.SERVER2_DATABASE_URL }} -e REDIS_URL=redis://unused:6379/0 daas-barcodes:${{ github.sha }} python scripts/runtime_smoke.py --ready

      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Validate monitoring rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/rules:ro" quay.io/prometheus/prometheus:v3.2.1 check rules /rules/alerts.yml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
