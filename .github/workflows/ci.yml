name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres_server1:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barcodes_server1
          POSTGRES_USER: barcodes
          POSTGRES_PASSWORD: barcodes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U barcodes -d barcodes_server1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres_server2:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: barcodes_server2
          POSTGRES_USER: barcodes
          POSTGRES_PASSWORD: barcodes
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U barcodes -d barcodes_server2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SERVER1_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5433/barcodes_server1
      SERVER2_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5434/barcodes_server2
      TEST_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5433/barcodes_server1
      TEST_SERVER2_DATABASE_URL: postgresql+asyncpg://barcodes:barcodes@localhost:5434/barcodes_server2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Upgrade Server 1 database
        env:
          DATABASE_URL: ${{ env.SERVER1_DATABASE_URL }}
        run: alembic -c alembic-server1.ini upgrade head

      - name: Upgrade Server 2 database
        env:
          DATABASE_URL: ${{ env.SERVER2_DATABASE_URL }}
        run: alembic -c alembic-server2.ini upgrade head

      - name: Check migration drift
        run: |
          DATABASE_URL=${{ env.SERVER1_DATABASE_URL }} alembic -c alembic-server1.ini check
          DATABASE_URL=${{ env.SERVER2_DATABASE_URL }} alembic -c alembic-server2.ini check

      - name: Test
        run: pytest

      - name: Build runtime image
        run: docker build --target runtime -t daas-barcodes:${{ github.sha }} .
